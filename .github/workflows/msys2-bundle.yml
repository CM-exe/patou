name: MSYS2 bundle

# Builds the "Open Patou bash here" MSYS2 + git bundle that
# patou-bash.exe uses, and publishes it as an asset on the *same* patou
# release as patou.exe/patou-bash.exe - scripts/install.ps1 and
# scripts/install.cmd download it from whichever patou version they're
# installing, exactly like the patou-<target>.zip assets. This runs the
# pacman-based setup (install MSYS2, install git) *once, in CI*, rather
# than on every end user's machine at install time.
#
# Uses msys2/setup-msys2 (https://github.com/msys2/setup-msys2) rather
# than hand-rolling the same thing, after repeatedly hitting the exact
# pitfalls that action already handles: manually downloading and
# self-extracting the base archive raced with its own extraction
# finishing, and even once that was fixed, `pacman` (by bare name, then
# by full path, `.exe` included) never resolved to an actual file when
# invoked as `bash -lc` from a plain PowerShell step - something about
# that setup differs from a properly-initialized MSYS2 session in a way
# worth not re-debugging by hand.
#
# Triggered by the Release workflow (release.yml) *completing*, rather
# than the same tag push, because uploading into that release requires
# it to already exist - release.yml's own `release` job is what creates
# it, and that has to finish first. The two workflows are otherwise
# independent (this one doesn't need release.yml's build output, just
# somewhere to attach its own asset). If Release didn't actually publish
# anything (e.g. failed, or was run manually off a branch with no tag),
# this falls back to attaching to patou's current latest release rather
# than skipping - see "Determine target release tag" below. Also runs
# manually or on a weekly schedule, for a refresh in between releases.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true

      - name: Install git and vim (retrying on transient mirror errors)
        shell: msys2 {0}
        # vim provides `vi` too (both a symlink and a Vi-compatible mode) -
        # standalone MSYS2, unlike Git for Windows, ships with no editor at
        # all, so without this `vi`/`vim`, git's own hardcoded fallback
        # editor, `git config --global --edit`, etc. would all fail with
        # "command not found" inside a bundled patou-bash session.
        run: |
          for i in 1 2 3 4 5; do
            pacman -S --needed --noconfirm git vim && exit 0
            echo "pacman failed (attempt $i/5) - mirror.msys2.org can be flaky; retrying in 15s..."
            sleep 15
          done
          echo "pacman still failing after 5 attempts" >&2
          exit 1

      - name: Drop pacman's package cache
        shell: msys2 {0}
        run: pacman -Scc --noconfirm
        # Not needed at runtime, and it's a meaningful chunk of the
        # archive size otherwise.

      - name: Package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if (-not (Test-Path "$env:MSYS2_LOCATION\usr\bin\git.exe")) {
            throw "$env:MSYS2_LOCATION\usr\bin\git.exe not found after setup-msys2"
          }
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          & $sevenZip a -tzip patou-msys2-x86_64.zip $env:MSYS2_LOCATION
          if ($LASTEXITCODE -ne 0) { throw "7z exited with code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patou-msys2-x86_64
          path: patou-msys2-x86_64.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: patou-msys2-x86_64

      - name: Determine target release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A workflow_run off an actual tag push means release.yml just
          # created (or updated) that tag's release - attach there. Any
          # other trigger (workflow_dispatch/schedule here, or a manual,
          # tagless run of Release) has no specific release in context,
          # so fall back to whatever patou's current latest release is.
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.event }}" = "push" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="$(gh release view --json tagName -q .tagName)"
          fi
          echo "Target release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload to that release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" patou-msys2-x86_64.zip --clobber
