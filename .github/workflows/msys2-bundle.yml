name: MSYS2 bundle

# Builds the "Open Patou bash here" MSYS2 + git bundle that
# patou-bash.exe uses, and publishes it as an asset on the *same* patou
# release as patou.exe/patou-bash.exe - scripts/install.ps1 and
# scripts/install.cmd download it from whichever patou version they're
# installing, exactly like the patou-<target>.zip assets. This runs the
# pacman-based setup (extract the MSYS2 base archive, bootstrap it,
# install git) *once, in CI*, rather than on every end user's machine at
# install time.
#
# Triggered by the Release workflow (release.yml) *completing*, rather
# than the same tag push, because uploading into that release requires
# it to already exist - release.yml's own `release` job is what creates
# it, and that has to finish first. The two workflows are otherwise
# independent (this one doesn't need release.yml's build output, just
# somewhere to attach its own asset). If Release didn't actually publish
# anything (e.g. failed, or was run manually off a branch with no tag),
# this falls back to attaching to patou's current latest release rather
# than skipping - see "Determine target release tag" below. Also runs
# manually or on a weekly schedule, for a refresh in between releases.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Download MSYS2 base
        shell: pwsh
        run: |
          $url = 'https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-base-x86_64-latest.sfx.exe'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile msys2-base.sfx.exe
          # Self-extracting 7-Zip archive containing a top-level msys64\
          # folder: -y accepts the license/skips prompts, -oC:\ (no
          # space) sets the destination's parent directory.
          & .\msys2-base.sfx.exe -y "-oC:\"

          # This particular sfx stub can return before extraction has
          # actually finished flushing every file to disk (observed:
          # usr\bin\bash.exe usable immediately, usr\bin\pacman.exe -
          # alphabetically later in the archive - not yet present),
          # so wait for pacman.exe specifically rather than trusting
          # that the process having exited means extraction is done.
          $pacmanPath = 'C:\msys64\usr\bin\pacman.exe'
          $deadline = (Get-Date).AddMinutes(2)
          while (-not (Test-Path $pacmanPath) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $pacmanPath)) {
            throw "extraction did not produce $pacmanPath within the timeout"
          }

      - name: Bootstrap MSYS2 and install git
        shell: pwsh
        run: |
          # Mirrors the sequence the official github.com/msys2/setup-msys2
          # action uses: the base archive's own runtime is stale relative
          # to MSYS2's live package repos, and the first update pass
          # commonly can't finish because it needs to replace
          # usr\bin\msys-2.0.dll itself while a pacman-spawned signature
          # verification helper still has it open - the taskkill clears
          # that before the second pass, which then completes.
          #
          # pacman is invoked by its exact full path, .exe included: bare
          # "pacman" failed to resolve via $PATH (while bash/sed did, in
          # the same session), and "/usr/bin/pacman" (no extension) then
          # failed too - bash's PATH search auto-tries name and name.exe,
          # but that auto-append does NOT happen for an explicit path
          # containing a slash, so the .exe suffix has to be spelled out.
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $pacman = '/usr/bin/pacman.exe'

          & $bash '-lc' 'uname -a'
          & $bash '-lc' "sed -i 's/^CheckSpace/#CheckSpace/g' /etc/pacman.conf"
          & $bash '-lc' "$pacman -Syuu --noconfirm --overwrite '*'" 2>&1 | Out-Null
          taskkill /F /FI "MODULES eq msys-2.0.dll" 2>&1 | Out-Null
          & $bash '-lc' "$pacman -Syuu --noconfirm --overwrite '*'"

          & $bash '-lc' "$pacman -S --needed --noconfirm --overwrite '*' git"
          if (-not (Test-Path 'C:\msys64\usr\bin\git.exe')) {
            throw 'pacman did not install git'
          }

          # Drop pacman's downloaded package cache - not needed at
          # runtime, and it's a meaningful chunk of the archive size.
          & $bash '-lc' "$pacman -Scc --noconfirm"

      - name: Package
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          & $sevenZip a -tzip patou-msys2-x86_64.zip C:\msys64
          if ($LASTEXITCODE -ne 0) { throw "7z exited with code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patou-msys2-x86_64
          path: patou-msys2-x86_64.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: patou-msys2-x86_64

      - name: Determine target release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A workflow_run off an actual tag push means release.yml just
          # created (or updated) that tag's release - attach there. Any
          # other trigger (workflow_dispatch/schedule here, or a manual,
          # tagless run of Release) has no specific release in context,
          # so fall back to whatever patou's current latest release is.
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.event }}" = "push" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="$(gh release view --json tagName -q .tagName)"
          fi
          echo "Target release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload to that release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" patou-msys2-x86_64.zip --clobber
